name: ArtCraft Release (Tachón Web + CLI Binary)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Tesseract OCR (spa+eng) para tests completos
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng

      - name: Instalar dependencias y ejecutar suite de pruebas
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt
          python probar_tachon.py

      - name: Compilar binario Linux x86_64
        run: |
          pyinstaller --onefile --collect-all fitz --collect-all rapidfuzz --name tachon-web app.py
          chmod +x dist/tachon-web
          tar -czf tachon-linux-x86_64.tar.gz -C dist tachon-web
          sha256sum tachon-linux-x86_64.tar.gz > tachon-linux-x86_64.tar.gz.sha256

      - name: Publicar GitHub Release automática desde main
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Tachón v1.0.${{ github.run_number }} (${{ github.sha }})"
          generate_release_notes: true
          files: |
            tachon-linux-x86_64.tar.gz
            tachon-linux-x86_64.tar.gz.sha256
